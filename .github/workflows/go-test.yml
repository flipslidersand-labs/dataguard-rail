name: Go Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-ingestion:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@d33890a74113f8ba8d8841a55b290007f72852ef # qa-workflows main (#167)
    with:
      go-version: "1.26"
      working-directory: go-ingestion
      # internal/pb は protoc 生成コード（DO NOT EDIT）で go-test.yml には除外オプションが
      # 無いため、これを含めた実測(2026-09-13) 46.7% に合わせて閾値を設定する。
      coverage-threshold: 40

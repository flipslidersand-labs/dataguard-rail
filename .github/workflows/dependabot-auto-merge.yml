name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  triage:
    if: github.actor == 'dependabot[bot]'
    uses: flipslidersand-labs/qa-workflows/.github/workflows/dependabot-auto-merge.yml@feat/dependabot-auto-merge-reusable

name: Dependabot Auto-merge (minor, 24h wait)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "true ならマージ・ラベル変更をせず、判定だけをログに出す"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/dependabot-auto-merge-minor.yml@2ca417cdbd9c5cea1919b894efff4b6cb5198d74 # qa-workflows#108 (自動マージの判断を promoter に集約, #106)
    with:
      dry-run: ${{ inputs.dry-run || false }}

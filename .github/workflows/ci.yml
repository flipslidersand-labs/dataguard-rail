name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Runner resolution: vars.GATE_RUNNER is set at the org level (linux-general).
# Do NOT set a repo-level GATE_RUNNER — it overrides the org value and can cause
# CI to queue indefinitely if that runner label has no available agents.
# Incident reference: #73 (2026-08-27, 2h queue caused by repo var arc-dev-nodee)
jobs:
  rust:
    name: Rust tests
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --all

      - name: Cargo clippy
        run: cargo clippy --all -- -D warnings

  go:
    name: Go tests
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: go-ingestion
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-ingestion/go.mod
          cache-dependency-path: go-ingestion/go.sum

      - name: go vet
        run: go vet ./...

      - name: Go test
        # internal/pb は protoc 生成コード（DO NOT EDIT）のためカバレッジ計測対象から除外する。
        # 含めると 0% 固定の統計で total を大きく押し下げ、閾値が実態を測れなくなる。
        run: go test -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /internal/pb)

      - name: Coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total/ {print $3}' | tr -d '%')
          # internal/pb 除外後の実測(2026-09-10時点) ≈ 52.4%。5〜10 ポイント程度の余裕を見て 45% に設定。
          awk "BEGIN { if (${pct} < 45) { print \"Coverage \" ${pct} \"% is below 45%\"; exit 1 } }"

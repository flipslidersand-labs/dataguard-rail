[package]
name = "dataguard-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlparser = "0.46"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

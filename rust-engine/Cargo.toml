[package]
name = "dataguard-engine"
version = "0.1.0"
edition = "2021"
description = "Rust analysis engine for DataGuard Rail — SQL column lineage, CSV quality rules (not_null/comparison/regex/unique), and data profiling"
license = "MIT"
repository = "https://github.com/flipslidersand/dataguard-rail"
keywords = ["data-quality", "lineage", "csv", "cli", "grpc"]
categories = ["command-line-utilities", "data-structures"]
include = ["src/**", "proto/**", "build.rs", "Cargo.toml", "README.md"]

[dependencies]
sqlparser = "0.46"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
